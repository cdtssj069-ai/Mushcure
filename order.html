<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mushcure — Place Your Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div class="logo">
    <img src="logo.png">
  </div>
  <nav>
    <a href="index.html#home">Home</a>
    <a href="index.html#products">Products</a>
    <a href="index.html#benefits">Benefits</a>
    <a href="index.html#training">Training</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<section class="section alt">
  <h2 class="title">Place an Order</h2>
  <div class="divider"></div>

  <div class="order-wrapper">

    <form id="orderForm" class="order-box">

      <div class="form-row two">
        <div class="field">
          <label>Customer Name</label>
          <input type="text" id="name" required>
        </div>

        <div class="field">
          <label>Phone Number</label>
          <input type="text" id="phone" required>
        </div>
      </div>

      <div class="form-row three">
        <div class="field">
          <label>Select Product</label>
          <select id="product">
            <option>White Oyster Mushrooms</option>
            <option>White Oyster Mushrooms Dried</option>
            <option>Oyster Mushroom Powder</option>
          </select>
        </div>

        <div class="field">
          <label>Pack Size</label>
          <select id="weight">
            <option>100g</option>
            <option>250g</option>
            <option>500g</option>
            <option>1kg</option>
          </select>
        </div>

        <div class="field">
          <label>Quantity</label>
          <input type="number" id="qty" value="1" min="1">
        </div>
      </div>

      <div class="field">
        <label>Delivery Address</label>
        <textarea id="address" rows="3" required></textarea>
      </div>

      <div class="field">
        <label>Additional Notes (optional)</label>
        <textarea id="note" rows="2"></textarea>
      </div>

      <button type="submit" class="btn primary full">Confirm Order</button>
    </form>
  </div>
</section>

<footer>
© 2025 Mushcure Farm — Premium Organic Mushrooms
</footer>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e){
  e.preventDefault();

  const customerName = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const product = document.getElementById("product").value;
  const weight = document.getElementById("weight").value;
  const qty = document.getElementById("qty").value;
  const address = document.getElementById("address").value;
  const note = document.getElementById("note").value;

  const msg =
`🛒 *Mushcure Order Request*\n\n
👤 Name: ${customerName}
📞 Phone: ${phone}

🍄 Product: ${product}
⚖️ Pack Size: ${weight}
🔢 Quantity: ${qty}

📍 Address:
${address}

📝 Notes: ${note || "None"}`;

  window.open(
    "https://wa.me/917568605896?text=" + encodeURIComponent(msg),
    "_blank"
  );
});
</script>

</body>
</html>
